<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adatok Importálása</title>
</head>
<body>
    <p><form action="/"><button type="submit">Vissza a főoldalra</button></form></p>
    
    <h1>Adatok importálása</h1>

    <form action="kuld/" method="POST">
        {% csrf_token %}
        <textarea name="adalekok" cols="60" rows="15" placeholder="Ide írd a az adalékokat"></textarea>
        <textarea name="funkciok" cols="60" rows="15" placeholder="Ide írd a a funkciokat"></textarea>
        <button type="submit">Küldés</button>
    </form>

</body>
</html>
