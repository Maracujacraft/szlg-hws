<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 adalék funkció</title>
</head>
<body>
    <p><form action="/"><button type="submit">Vissza a főoldalra</button></form></p>

    <p>Funkciók, amelyek legalább 50 adaléknál jelen vannak:</p>
    <ul>
        {% for elem in data %}
        <li>{{ elem }}</li>
        {% endfor %}
    </ul>
</body>
</html>
